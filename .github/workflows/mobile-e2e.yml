name: Mobile end-to-end validation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Maestro locally
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot an available iPhone simulator
        run: |
          IOS_UDID="$(xcrun simctl list devices available -j | node -e 'let input=\"\"; process.stdin.on(\"data\", chunk => input += chunk); process.stdin.on(\"end\", () => { const devices = Object.values(JSON.parse(input).devices).flat(); const match = devices.find(device => device.isAvailable && /^iPhone/.test(device.name)); if (!match) process.exit(1); process.stdout.write(match.udid); });')"
          echo "IOS_UDID=$IOS_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$IOS_UDID" || true
          xcrun simctl bootstatus "$IOS_UDID" -b

      - name: Build and install the release app
        run: npx expo run:ios --configuration Release --device "$IOS_UDID" --no-bundler

      - name: Run current Vitruvius journeys
        env:
          MAESTRO_APP_ID: com.davidfamularo.projectphotoupdate
          MAESTRO_PROJECT_NAME: 2375 Compliance Project
        run: npm run test:e2e:maestro

  maestro-android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact dependencies
        run: npm ci

      - name: Install Maestro locally
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build, install, and test on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            npx expo run:android --variant release --no-bundler
            MAESTRO_APP_ID=com.davidfamularo.projectphotoupdate MAESTRO_PROJECT_NAME="2375 Compliance Project" npm run test:e2e:maestro
