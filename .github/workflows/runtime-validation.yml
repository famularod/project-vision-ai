name: ECOS runtime validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.2
      - name: Type-check the deployed runtime separately from the app
        run: deno check --frozen workers/ecos-agent-query-runtime/main.ts supabase/functions/ecos-ask-project-candidate/index.ts
      - name: Run backend behavior and authority regression tests
        run: deno test --frozen --allow-env --allow-read --no-check supabase/functions workers/ecos-agent-query-runtime
      # These tests never activate traffic, publish evidence or create sessions.
      # Visible device tests and real-file proof are separate release gates.
