name: Mobile validation

on:
  pull_request:
  push:
    # Updated 2026-09-20: neither main nor v0.8-architecture-refactor exists on
    # this remote, so the push trigger never fired and only pull_request did.
    branches: [repair/batch-3-reports, fix/build191-ios-source-modules]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use SDK-compatible Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.17.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit exact dependency lock
        run: npm audit --audit-level=low

      - name: Validate release, migration, UI, and device-flow contracts
        run: npm run test:release-contracts

      - name: Run default executable test gate
        run: npm test

      - name: Run complete local release gate
        run: npm run qa:release

  native-release-generation:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use SDK-compatible Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.17.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Generate native release projects from source configuration
        run: |
          npx expo prebuild --platform all --no-install --clean
          npm run sync:native-release-metadata
          npm run check:release-metadata
          npm run check:android-production-signing

      - name: Export iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir build/export-ios

      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir build/export-android
